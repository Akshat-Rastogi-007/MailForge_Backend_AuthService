# ===============================
# AuthService - Base Configuration
# ===============================
# Use profile-specific configs: application-{profile}.properties
# Available profiles: local (default), dev, prod
#
# Run with profile:
#   java -Dspring.profiles.active=local -jar auth-service.jar
#   java -Dspring.profiles.active=dev -jar auth-service.jar
#   java -Dspring.profiles.active=prod -jar auth-service.jar

spring.application.name=AUTH-SERVICE

# ===============================
# JPA Configuration
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ===============================
# Common Jackson Configuration
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# Server Error Configuration
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ===============================
# Connection Pool Configuration
# ===============================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
